name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  policy:
    name: Policy bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The Go tests compile the bundle, but opa check also catches unused
      # imports and style problems the compiler tolerates.
      - name: Check Rego
        run: opa check --strict internal/checks/policies

      - name: Check Rego formatting
        run: opa fmt --list --fail internal/checks/policies

      - name: Verify the bundle loads
        run: go run ./cmd/scm-bench list-checks

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A snapshot build exercises the full release matrix on every push, so a
      # broken goreleaser config is found before a tag depends on it.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean
